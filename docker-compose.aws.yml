# Override para el EC2 del Learner Lab:
#   docker compose -f docker-compose.yml -f docker-compose.aws.yml up -d --build
# El backend y el worker usan el rol de la instancia (LabInstanceProfile) para Athena, Kinesis, S3 y Glue;
# no hay credenciales en archivos.
services:
  api:
    environment:
      ANALYTICS_ENGINE: athena
      ATHENA_DATABASE: ${ATHENA_DATABASE:-airline_analytics}
      ATHENA_WORKGROUP: ${ATHENA_WORKGROUP:-primary}
      ATHENA_OUTPUT: ${ATHENA_OUTPUT:?Defina ATHENA_OUTPUT=s3://SU-BUCKET/athena-results/ en .env}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      KINESIS_STREAM: ${KINESIS_STREAM:-airline-events}
  worker:
    environment:
      KINESIS_STREAM: ${KINESIS_STREAM:-airline-events}
      RAW_EVENTS_URI: ${RAW_EVENTS_URI:?Defina RAW_EVENTS_URI=s3://SU-BUCKET/raw/events/ en .env}
      STAR_URI: ${STAR_URI:?Defina STAR_URI=s3://SU-BUCKET/star/ en .env}
      ATHENA_OUTPUT: ${ATHENA_OUTPUT:?Defina ATHENA_OUTPUT=s3://SU-BUCKET/athena-results/ en .env}
  db:
    ports: !reset []   # PostgreSQL no se expone fuera del EC2
