# Proyección mensual del despliegue en AWS (Learner Lab, us-east-1). Parcial 3.
# El harness suma line_items (no se escribe total). Precios de parcial3-harness-estudiantes/pricing.yaml.
assumptions: >
  ~5.000 búsquedas/día y ~300 reservas/día (+ ~35 cancelaciones/día); eventos de ~300 B.
  El stream Kinesis (1 shard aprovisionado, retención por defecto de 24 h) solo existe mientras se trabaja o
  se prueba: ~200 h/mes (se crea y se borra con scripts/p3/stream.sh). La landing zone recibe 1 objeto gzip
  por minuto mientras el stream existe (~12.000 PUT/mes) y ocupa ~60 MB/mes. La estrella se reconstruye
  cada 10 min solo si llegó algo nuevo (ETL con DuckDB dentro del worker del EC2: costo marginal 0) y se
  registra en Glue con DDL de Athena (no se factura). ~1.000 consultas analíticas/mes x 10 MB mínimo
  facturable. El histórico del Parcial 2 sigue igual (1 corrida EMR/mes, ~9.000 consultas del panel).
  Un solo EC2 24/7 para PostgreSQL + API + worker + nginx.
line_items:
  - {service: "EC2", detail: "1 x t3.small 24/7 (Docker: PostgreSQL + FastAPI + worker de eventos + nginx), 730 h x 0.0208", monthly_usd: 15.2}
  - {service: "EBS", detail: "20 GB gp3 del EC2 (PostgreSQL, checkpoint y caché del worker)", monthly_usd: 1.6}
  - {service: "Kinesis", detail: "1 shard aprovisionado solo mientras se prueba: ~200 h x 0.015 USD/h; PUT payload units < 0.01", monthly_usd: 3.0}
  - {service: "S3", detail: "~0,3 GB (landing zone JSON gzip + Parquet de la estrella + histórico P2 + resultados Athena) + ~15.000 PUT", monthly_usd: 0.2}
  - {service: "Athena", detail: "panel P2 (~9.000 x 10 MB) + ~1.000 consultas a la estrella x 10 MB = ~0,1 TB x 5 USD/TB; DDL gratis", monthly_usd: 0.5}
  - {service: "EMR", detail: "Parcial 2: 1 corrida/mes, 3 x m4.large, 1 h facturable", monthly_usd: 0.4}
  - {service: "Glue", detail: "Data Catalog: 7 tablas + ~30 particiones, dentro de la capa gratuita (1 M objetos)", monthly_usd: 0.0}
