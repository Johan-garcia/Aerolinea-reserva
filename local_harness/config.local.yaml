# Config del harness para el sistema local (docker compose). Para AWS use parcial2-harness/config.yaml.
team_id: "team-wilches-garcia"
seed: 12345              # <- cambie por la semilla asignada al equipo (y regenere los datos)

backend:
  base_url: "http://localhost:8000"
frontend:
  base_url: "http://localhost:3000"

aws:
  region: us-east-1
  athena_workgroup: primary
  athena_database: airline_analytics
  tables:
    detail: reservations_curated
    metrics: route_month_metrics

cost_projection_file: cost_projection.yaml   # relativo a la raíz del repo
