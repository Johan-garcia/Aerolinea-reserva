<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reservar vuelo - Aerovía</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%232457A6' d='M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>
      Aerovía
    </a>
    <nav class="topnav" aria-label="Secciones">
      <a href="/" aria-current="page">Reservar</a>
      <a href="/manager">Panel gerencial</a>
    </nav>
  </header>

  <main>
    <h1 class="sr-only">Buscar y reservar un vuelo</h1>
    <form id="search" autocomplete="off" novalidate>
      <div id="route-picker"></div>
      <div class="route-board">
        <div class="airport from">
          <label for="origin">Desde</label>
          <input id="origin" class="iata" data-testid="search-origin" maxlength="3" placeholder="BOG"
                 value="BOG" required pattern="[A-Za-z]{3}" aria-describedby="origin-city">
          <span class="city" id="origin-city"></span>
        </div>

        <div class="flight-path">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" transform="rotate(90 12 12)" d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>
          <button type="button" class="swap" id="swap">Invertir ruta</button>
        </div>

        <div class="airport to">
          <label for="destination">Hacia</label>
          <input id="destination" class="iata" data-testid="search-destination" maxlength="3" placeholder="MDE"
                 value="MDE" required pattern="[A-Za-z]{3}" aria-describedby="destination-city">
          <span class="city" id="destination-city"></span>
        </div>
      </div>

      <div class="search-row">
        <div class="field">
          <label for="date">Fecha de salida</label>
          <input id="date" class="input" type="date" data-testid="search-date" required>
        </div>
        <button class="btn" type="submit" data-testid="search-submit">Buscar vuelos</button>
      </div>
    </form>

    <form id="lookup" class="search-row lookup" autocomplete="off" novalidate>
      <div class="field">
        <label for="lookup-id">¿Ya reservaste? Consulta tu reserva con el código</label>
        <input id="lookup-id" class="input" maxlength="32" placeholder="R7K334UNY5S8" spellcheck="false">
      </div>
      <button class="btn ghost" type="submit">Consultar reserva</button>
    </form>

    <section id="results" class="results" aria-live="polite" hidden></section>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
